name: Deploy to Staging (test.akuru.edu.mv)

# Auto-deploys to the staging/test server on every push to `main`.
# Model matches the documented workflow in docs/STAGING.md:
#   "Mac pushes, server pulls" -> here GitHub Actions triggers the server pull.
#
# Front-end assets are built on the runner (npm is often not on the cPanel PATH,
# see docs/STAGING.md) and rsynced to the server. PHP/Composer/artisan run on the
# server over SSH.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_SSH_HOST   - server hostname or IP (e.g. sg-s2.example-host.com)
#   STAGING_SSH_USER   - cPanel account (e.g. akuruedu)
#   STAGING_SSH_KEY    - private SSH key (PEM) authorized on the server
# Optional secrets (defaults shown):
#   STAGING_SSH_PORT   - SSH port (default: 22; many cPanel hosts use 21098)
#   STAGING_APP_DIR    - app path on server (default: ~/test.akuru.edu.mv)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two staging deploys at once; cancel superseded runs.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build assets and deploy over SSH
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.STAGING_APP_DIR || '~/test.akuru.edu.mv' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull code, install PHP deps, migrate
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -e
          cd $APP_DIR
          echo "==> Current commit: \$(git rev-parse --short HEAD)"
          git fetch origin main
          git checkout main
          git pull origin main
          echo "==> Deployed commit: \$(git rev-parse --short HEAD)"
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          EOF

      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            public/build/ "$SSH_USER@$SSH_HOST:$APP_DIR/public/build/"

      - name: Rebuild caches and restart queue
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -e
          cd $APP_DIR
          php artisan config:cache
          # route:clear (NOT route:cache) - route cache breaks mcamara localized routes.
          php artisan route:clear
          php artisan view:cache
          php artisan queue:restart || true
          echo "==> Staging deploy complete."
          EOF

      - name: Smoke check
        run: |
          echo "Checking https://test.akuru.edu.mv/up"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://test.akuru.edu.mv/up || echo "000")
          echo "HTTP status: $code"
          test "$code" = "200"
